<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#1E3A2B"/>
  <!-- Weighing Scale Icon in Gold / Cream -->
  <g fill="none" stroke="#C9962F" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Beam / Stand -->
    <line x1="256" y1="110" x2="256" y2="400"/>
    <line x1="160" y1="400" x2="352" y2="400"/>
    <circle cx="256" cy="110" r="16" fill="#C9962F"/>
    
    <!-- Balance Arm -->
    <line x1="110" y1="160" x2="402" y2="160"/>
    
    <!-- Left Pan -->
    <line x1="110" y1="160" x2="60" y2="280"/>
    <line x1="110" y1="160" x2="160" y2="280"/>
    <path d="M 50 280 Q 110 320 170 280 Z" fill="#F7F2E7" stroke="#C9962F" stroke-width="16"/>
    
    <!-- Right Pan -->
    <line x1="402" y1="160" x2="352" y2="280"/>
    <line x1="402" y1="160" x2="452" y2="280"/>
    <path d="M 342 280 Q 402 320 462 280 Z" fill="#F7F2E7" stroke="#C9962F" stroke-width="16"/>
  </g>
  <!-- App Label Accent -->
  <text x="256" y="455" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#F7F2E7" text-anchor="middle" letter-spacing="4">MANDI</text>
</svg>
